<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Inkwell Books cover">
  <defs>
    <radialGradient id="glow" cx="30%" cy="110%" r="80%">
      <stop offset="0" stop-color="#ccff00" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#2d7a1e" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="17" cy="17" r="1.4" fill="#ffffff" fill-opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="#050505"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <g transform="translate(160 100) scale(0.8)">

  <!-- Book stack -->
  <g transform="translate(250 190)">
    <!-- bottom book -->
    <g transform="translate(0 440)">
      <rect width="640" height="110" rx="10" fill="#161616" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
      <rect x="40" y="0" width="20" height="110" fill="#ccff00"/>
      <rect x="560" y="0" width="12" height="110" fill="#ffffff" fill-opacity="0.18"/>
      <text x="100" y="66" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" letter-spacing="6" fill="#e4e4e7">DATA STRUCTURES</text>
    </g>
    <!-- middle book -->
    <g transform="translate(40 320)">
      <rect width="580" height="110" rx="10" fill="#ccff00"/>
      <rect x="500" y="0" width="14" height="110" fill="#050505" fill-opacity="0.2"/>
      <text x="40" y="66" font-family="Georgia, serif" font-size="40" font-style="italic" fill="#050505">The Art of Systems</text>
    </g>
    <!-- top book -->
    <g transform="translate(10 200)">
      <rect width="610" height="110" rx="10" fill="#1d1d1d" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
      <rect x="520" y="0" width="14" height="110" fill="#ccff00"/>
      <text x="40" y="66" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" letter-spacing="6" fill="#e4e4e7">CLEAN CODE</text>
    </g>
    <!-- leaning book -->
    <g transform="translate(470 40) rotate(14)">
      <rect width="120" height="170" rx="8" fill="#0f0f0f" stroke="#ccff00" stroke-opacity="0.7" stroke-width="3"/>
      <rect x="18" y="22" width="84" height="6" fill="#ccff00"/>
      <rect x="18" y="40" width="60" height="6" fill="#ffffff" fill-opacity="0.25"/>
    </g>
  </g>

  <!-- Title block -->
  <g transform="translate(980 330)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="8" fill="#ccff00">FULL-STACK BOOKSTORE</text>
    <text x="0" y="120" font-family="Inter, Arial, sans-serif" font-size="110" font-weight="900" letter-spacing="-4" fill="#ffffff">INKWELL</text>
    <text x="0" y="230" font-family="Georgia, serif" font-size="100" font-style="italic" fill="#9ca3af">books</text>
    <g font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="3" fill="#71717a">
      <text x="0" y="310">CATALOG · CART · REVIEWS</text>
      <text x="0" y="346">ADMIN DASHBOARD · ORDERS</text>
    </g>
  </g>
  </g>
</svg>
