<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Flash ticket sale platform cover">
  <defs>
    <radialGradient id="glow" cx="50%" cy="115%" r="75%">
      <stop offset="0" stop-color="#ccff00" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#2d7a1e" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1b1b"/>
      <stop offset="1" stop-color="#0b0b0b"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="17" cy="17" r="1.4" fill="#ffffff" fill-opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="#050505"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <g transform="translate(160 100) scale(0.8)">

  <!-- Ticket -->
  <g transform="translate(330 230)">
    <path d="M0 40a40 40 0 0 1 40-40H680V80a40 40 0 0 0 0 80v0a40 40 0 0 0 0 80v0a40 40 0 0 0 0 80v0a40 40 0 0 0 0 80v0a40 40 0 0 0 0 80V540H40a40 40 0 0 1-40-40z" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
    <path d="M680 0h240a40 40 0 0 1 40 40V500a40 40 0 0 1-40 40H680z" fill="#ccff00"/>
    <line x1="680" y1="20" x2="680" y2="520" stroke="#050505" stroke-width="3" stroke-dasharray="10 12"/>

    <text x="60" y="110" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="8" fill="#ccff00">LIVE · LIMITED SEATS</text>
    <text x="60" y="230" font-family="Inter, Arial, sans-serif" font-size="120" font-weight="900" letter-spacing="-5" fill="#ffffff">FLASH</text>
    <text x="60" y="340" font-family="Georgia, serif" font-size="110" font-style="italic" fill="#9ca3af">sale</text>

    <!-- queue dots -->
    <g transform="translate(60 410)">
      <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="5" fill="#71717a">YOU ARE IN THE QUEUE</text>
      <g transform="translate(0 34)" fill="#3f3f46">
        <circle cx="12" cy="12" r="12"/><circle cx="52" cy="12" r="12"/><circle cx="92" cy="12" r="12"/>
        <circle cx="132" cy="12" r="12"/><circle cx="172" cy="12" r="12"/><circle cx="212" cy="12" r="12"/>
        <circle cx="252" cy="12" r="12" fill="#ccff00"/>
      </g>
      <text x="300" y="62" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#ccff00">#7</text>
    </g>

    <!-- stub -->
    <g transform="translate(720 0)" fill="#050505">
      <text x="40" y="110" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="6">ADMIT</text>
      <text x="40" y="200" font-family="Inter, Arial, sans-serif" font-size="96" font-weight="900" letter-spacing="-4">01</text>
      <g transform="translate(40 250)">
        <rect x="0" y="0" width="8" height="190"/><rect x="18" y="0" width="4" height="190"/><rect x="32" y="0" width="12" height="190"/>
        <rect x="54" y="0" width="4" height="190"/><rect x="68" y="0" width="8" height="190"/><rect x="88" y="0" width="14" height="190"/>
        <rect x="112" y="0" width="4" height="190"/><rect x="126" y="0" width="10" height="190"/><rect x="146" y="0" width="6" height="190"/>
        <rect x="162" y="0" width="12" height="190"/>
      </g>
    </g>
  </g>

  <!-- Chips -->
  <g font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">
    <g transform="translate(330 830)"><rect width="150" height="52" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.25"/><text x="75" y="33" text-anchor="middle" fill="#e4e4e7">RBAC</text></g>
    <g transform="translate(500 830)"><rect width="290" height="52" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.25"/><text x="145" y="33" text-anchor="middle" fill="#e4e4e7">RATE LIMITING</text></g>
    <g transform="translate(810 830)"><rect width="210" height="52" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.25"/><text x="105" y="33" text-anchor="middle" fill="#e4e4e7">QUEUEING</text></g>
    <g transform="translate(1040 830)"><rect width="230" height="52" rx="26" fill="#ccff00"/><text x="115" y="33" text-anchor="middle" fill="#050505">BUILDING…</text></g>
  </g>
  </g>
